<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization · Mir Oboev Publisher</title><link rel="stylesheet" href="style.css"><link rel="icon" href="icon.png">
<meta name="robots" content="noindex"></head>
<body>
<header><div class="wrap"><img src="icon.png" alt=""><div><b>Mir Oboev Publisher</b><small>«Мир обоев» · Dushanbe</small></div></div></header>
<main class="wrap">
<!-- Redirect URI для TikTok Login Kit. Страница ничего никуда не отправляет:
     она только показывает одноразовый код, который владелец передаёт в защищённую форму. -->
<h1 id="title">Authorization</h1>
<div id="out"></div>
</main>
<script>
const p = new URLSearchParams(location.search);
const out = document.getElementById('out');
const code = p.get('code');
if (code) {
  document.getElementById('title').textContent = 'TikTok connected · TikTok подключён';
  out.innerHTML = '<p>Authorization code (valid a few minutes, one-time):<br>Одноразовый код (действует несколько минут):</p>' +
    '<span class="code" id="c"></span><button id="b">Copy · Скопировать</button>';
  document.getElementById('c').textContent = code;
  document.getElementById('b').onclick = () => navigator.clipboard.writeText(code)
    .then(() => { document.getElementById('b').textContent = 'Copied ✓ · Скопировано ✓'; });
} else if (p.get('error')) {
  out.innerHTML = '<p>Authorization was not completed · Авторизация не завершена:</p><span class="code" id="e"></span>';
  document.getElementById('e').textContent = p.get('error') + (p.get('error_description') ? ': ' + p.get('error_description') : '');
} else {
  out.innerHTML = '<p>This page receives the TikTok authorization result for the store’s publishing tool.</p>' +
    '<p><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></p>';
}
</script>
</body></html>
